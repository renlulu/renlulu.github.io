name: crypto-web3
description: Crypto & Web3 domain-specific translation rules and glossary

glossary:
  blockchain: 区块链
  smart contract: 智能合约
  DeFi: DeFi（去中心化金融）
  NFT: NFT（非同质化代币）
  token: 代币
  tokenomics: 代币经济学
  wallet: 钱包
  gas fee: Gas 费
  mining: 挖矿
  staking: 质押
  yield: 收益率
  liquidity: 流动性
  liquidity pool: 流动性池
  DEX: DEX（去中心化交易所）
  CEX: CEX（中心化交易所）
  DAO: DAO（去中心化自治组织）
  governance: 治理
  mainnet: 主网
  testnet: 测试网
  Layer 1: Layer 1（一层网络）
  Layer 2: Layer 2（二层网络）
  rollup: Rollup
  zero-knowledge proof: 零知识证明
  ZK: ZK（零知识）
  bridge: 跨链桥
  oracle: 预言机
  TVL: TVL（总锁仓量）
  airdrop: 空投
  whitepaper: 白皮书
  bull market: 牛市
  bear market: 熊市
  HODL: HODL（长期持有）
  whale: 巨鲸
  rug pull: Rug Pull（跑路）
  FUD: FUD（恐惧、不确定、怀疑）
  DYOR: DYOR（自行研究）
  memecoin: Meme 币
  altcoin: 山寨币
  stablecoin: 稳定币

prompt: |
  You are a professional translator specializing in crypto and Web3 content.
  In addition to general translation rules, apply these domain-specific guidelines:
  - Keep widely recognized crypto terms in English with Chinese annotations on first occurrence.
  - For project names and protocol names, keep the original English.
  - Translate market commentary with appropriate Chinese crypto community tone.
  - Use the crypto-specific glossary for consistent terminology.

entities:
  - pattern: "\\b(Bitcoin|BTC)\\b"
    category: cryptocurrency
    translation: 比特币（Bitcoin）
  - pattern: "\\b(Ethereum|ETH)\\b"
    category: cryptocurrency
    translation: 以太坊（Ethereum）
  - pattern: "\\b(Solana|SOL)\\b"
    category: cryptocurrency
    translation: Solana（SOL）
